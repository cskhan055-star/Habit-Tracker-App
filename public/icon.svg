<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#E9CC8B" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#15171B" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </radialGradient>
  </defs>
  <!-- Background rounded squircle with hairline border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#26282C" stroke-width="12" />
  
  <!-- Outer Gold Laurel / Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#26282C" stroke-width="4" stroke-dasharray="8 12" />
  
  <!-- Flame Core -->
  <path d="M256 112 C256 112 304 200 304 256 C304 282 292 304 274 320 C270 298 256 280 238 268 C238 308 252 336 244 366 C238 388 218 404 194 404 C158 404 130 374 130 334 C130 274 190 212 256 112 Z" fill="url(#goldGrad)" />
  
  <!-- Inner Check Emblem -->
  <circle cx="340" cy="340" r="48" fill="#15171B" stroke="url(#goldGrad)" stroke-width="12" />
  <polyline points="324 340 335 351 358 326" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
